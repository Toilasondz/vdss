name: Build VideoStar Dylibs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Show Xcode and SDK info
      run: |
        xcode-select -p
        xcrun --sdk iphoneos --show-sdk-path
        clang --version

    - name: Fix line endings (CRLF → LF)
      run: |
        find . -name "*.m" -exec sed -i '' 's/\r$//' {} \;
        find . -name "*.h" -exec sed -i '' 's/\r$//' {} \;

    - name: Create build directory
      run: mkdir -p build

    - name: Compile VS40Layers.dylib (Mở Khóa 40 Lớp Video Star 14)
      run: |
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "Compiling VS40Layers.dylib with SDK: $SDK"

        clang \
          -arch arm64 \
          -isysroot "$SDK" \
          -mios-version-min=14.0 \
          -fobjc-arc \
          -shared \
          -fmodules \
          -framework UIKit \
          -framework Foundation \
          -framework CoreGraphics \
          -o build/VS40Layers.dylib \
          Sources/VS40Layers.m

        echo "✅ VS40Layers.dylib compiled successfully!"

    - name: Compile VideoStarTool.dylib (Menu Đa Năng by hson)
      run: |
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "Compiling VideoStarTool.dylib with SDK: $SDK"

        clang \
          -arch arm64 \
          -isysroot "$SDK" \
          -mios-version-min=14.0 \
          -fobjc-arc \
          -shared \
          -fmodules \
          -framework UIKit \
          -framework Foundation \
          -framework Photos \
          -framework PhotosUI \
          -framework CoreGraphics \
          -o build/VideoStarTool.dylib \
          Sources/Tweak_Standalone.m

        echo "✅ VideoStarTool.dylib compiled successfully!"
        ls -lh build/

    - name: Verify compiled dylibs
      run: |
        file build/*.dylib

    - name: Upload VS40Layers dylib
      uses: actions/upload-artifact@v4
      with:
        name: VS40Layers-dylib
        path: build/VS40Layers.dylib
        retention-days: 30

    - name: Upload VideoStarTool dylib
      uses: actions/upload-artifact@v4
      with:
        name: VideoStarTool-dylib
        path: build/VideoStarTool.dylib
        retention-days: 30

    - name: Upload All Dylibs Pack
      uses: actions/upload-artifact@v4
      with:
        name: VideoStar-Dylibs-All
        path: build/*.dylib
        retention-days: 30
